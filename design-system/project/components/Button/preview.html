<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=Space+Grotesk:wght@500;700&family=Instrument+Serif:ital@1&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;padding:24px;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}.wrap{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.95rem 1.7rem;border-radius:99px;font-family:var(--font-display);font-weight:500;font-size:.92rem;letter-spacing:-.01em;border:1px solid transparent;position:relative;overflow:hidden;isolation:isolate;transition:color .3s var(--ease),border-color .3s,transform .35s var(--ease)}
.btn::before{content:'';position:absolute;inset:0;background:var(--text);transform:translateY(101%);transition:transform .5s var(--ease);z-index:-1}
.btn:hover::before{transform:translateY(0)}
.btn-solid{background:var(--accent-surface);color:var(--accent-ink)}.btn-solid:hover{color:var(--bg)}
.btn-line{border-color:var(--line-2);color:var(--text)}.btn-line::before{background:var(--accent-surface)}.btn-line:hover{color:var(--accent-ink);border-color:var(--accent)}
.arr{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s var(--ease)}.btn:hover .arr{transform:translate(3px,-3px)}
.pill-btn{padding:.58rem 1.15rem;border-radius:99px;background:var(--accent-surface);color:var(--accent-ink);font-family:var(--font-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;transition:border-color .25s,transform .3s var(--ease)}.icon-btn:hover{border-color:var(--accent);transform:rotate(20deg)}.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5}</style></head><body><div class="wrap"><a href="#" class="btn btn-solid">Ver projetos <svg class="arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg></a><a href="#" class="btn btn-line">Fale comigo</a><a href="#" class="pill-btn">Contato</a><button class="icon-btn" aria-label="Alternar tema"><svg viewBox="0 0 24 24"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg></button></div></body></html>
