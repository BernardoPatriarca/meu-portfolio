<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=Space+Grotesk:wght@500;700&family=Instrument+Serif:ital@1&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);width:960px;height:288px;position:relative;overflow:hidden}
svg{position:absolute;inset:0}
.as{fill:var(--accent-surface)}.a2{fill:var(--accent-2)}.s2{fill:var(--surface-2)}.mg{fill:var(--magenta)}.tx{fill:var(--text)}.gd{fill:var(--bg)}
.t{position:absolute;left:40px;bottom:36px;max-width:440px}
h1{font-family:var(--font-display);font-weight:700;font-size:72px;line-height:.92;letter-spacing:-.04em;text-transform:uppercase;color:var(--text)}
p{margin-top:16px;font-family:var(--font-mono);font-size:13px;letter-spacing:.04em;color:var(--muted)}

escalas: módulo 96px (e meio módulo 48px), cantos retos, mira de 16px com traço de 2px
-->
